<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>꿈동글 월드 | DREAMDONGLE WORLD</title>
<style>
:root{--bg:#f7f1e5;--surface:#fffdf7;--text:#3d3126;--muted:#7a6a58;--line:#e6dcc8;--accent:#6b7a3a;--accent-text:#fff;--brown:#7b5a3c;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1914;--surface:#2a231c;--text:#f1e8d8;--muted:#b9a98f;--line:#44392c;--accent:#a3b45b;--accent-text:#1e1914;--brown:#d2b08a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1e1914;--surface:#2a231c;--text:#f1e8d8;--muted:#b9a98f;--line:#44392c;--accent:#a3b45b;--accent-text:#1e1914;--brown:#d2b08a;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;line-height:1.6;overflow-x:hidden;word-break:keep-all}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;height:60px}
.logo{font-weight:800;text-decoration:none;color:var(--brown);font-size:1.1rem;margin-right:auto}
nav{display:flex;gap:4px}
nav a{padding:10px 12px;border-radius:999px;text-decoration:none;font-size:.92rem;color:var(--muted)}
nav a:hover,nav a:focus-visible{background:var(--surface);color:var(--text)}
.icon-btn{min-width:44px;height:44px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;cursor:pointer;font-size:1rem}
#menuBtn{display:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media(max-width:640px){#menuBtn{display:block}nav{display:none;position:absolute;top:60px;left:0;right:0;background:var(--bg);border-bottom:1px solid var(--line);flex-direction:column;padding:8px 16px}nav.open{display:flex}nav a{padding:14px 8px}}
.hero{text-align:center;padding:72px 0 56px}
.eyebrow{letter-spacing:.3em;font-size:.78rem;color:var(--accent);font-weight:700}
.hero h1{font-size:clamp(2.4rem,9vw,4rem);margin:8px 0;color:var(--brown);line-height:1.15}
.slogan{font-size:clamp(1.1rem,3.6vw,1.5rem);font-weight:700;max-width:640px;margin:20px auto 12px}
.sub{color:var(--muted);max-width:520px;margin:0 auto 28px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border-radius:999px;background:var(--accent);color:var(--accent-text);font-weight:700;text-decoration:none;border:0;cursor:pointer;font-size:.95rem}
.btn[aria-disabled="true"]{background:var(--line);color:var(--muted);cursor:not-allowed}
section{padding:48px 0}
h2{font-size:1.6rem;margin:0 0 6px;color:var(--brown)}
.lead{color:var(--muted);margin:0 0 20px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tab{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;font-size:.95rem}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:700}
.grid{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:1/1;background:var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.85rem;text-align:center}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.cat{font-size:.75rem;color:var(--accent);font-weight:700}
.name{font-weight:700;font-size:.98rem;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.reason{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere;flex:1}
.price{font-size:.88rem}
.tag{display:inline-block;font-size:.7rem;border:1px dashed var(--brown);color:var(--brown);border-radius:6px;padding:0 6px;width:fit-content}
.feat{font-size:.7rem;background:var(--accent);color:var(--accent-text);border-radius:6px;padding:0 6px;width:fit-content}
.card .btn{margin-top:6px;width:100%}
.plist{display:grid;gap:10px}
.prow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.prow .thumb{width:56px;height:56px;aspect-ratio:auto;border-radius:10px;flex:none;overflow:hidden;font-size:1.3rem}
.prow .info{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.prow .btn{min-height:40px;padding:0 14px;font-size:.85rem;flex:none}
.prow .ic{font-size:1.6rem;width:40px;text-align:center;flex:none}
.posts{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.post{display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;align-items:center}
.post .thumb{width:72px;height:72px;aspect-ratio:auto;border-radius:10px;flex:none;overflow:hidden}
.post .info{min-width:0;flex:1}
.post .t{font-weight:700;overflow-wrap:anywhere}
.meta{font-size:.82rem;color:var(--muted)}
.channels{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:760px){.channels{grid-template-columns:repeat(3,1fr)}}
.ch{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:8px}
.ch .ic{font-size:2rem}
.empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:12px}
footer{border-top:1px solid var(--line);padding:36px 0;color:var(--muted);font-size:.88rem}
footer strong{color:var(--brown);font-size:1.05rem}
.flinks{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0}
.flinks a,.flinks span{padding:8px 0}
.notice{font-size:.8rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="logo" href="#home">꿈동글 월드</a>
    <nav id="nav" aria-label="주 메뉴">
      <a href="#home">홈</a><a href="#groupbuy">공동구매</a><a href="#picks">꿈동글 픽</a><a href="#posts">대표 포스팅</a><a href="#channels">채널 모음</a>
    </nav>
    <button class="icon-btn" id="themeBtn" aria-label="다크모드 전환" type="button">🌙</button>
    <button class="icon-btn" id="menuBtn" aria-label="메뉴 열기" aria-expanded="false" type="button">☰</button>
  </div>
</header>

<main>
<div class="wrap">
  <div class="hero" id="home">
    <div class="eyebrow">DREAMDONGLE WORLD</div>
    <h1>꿈동글 월드</h1>
    <p class="slogan">직접 써 보고 남기는 솔직한 후기, 다시 살 만한 제품만 소개해요!</p>
    <p class="sub">직접 경험한 이야기와 추천 아이템을 한곳에 모았어요.</p>
    <a class="btn" href="#picks">꿈동글 픽 보러 가기</a>
  </div>

  <section id="groupbuy" aria-labelledby="gbT">
    <h2 id="gbT">공동구매</h2>
    <p class="lead">진행 중이거나 예정된 공동구매를 모아 두었어요.</p>
    <div class="grid" id="gbGrid"></div>
  </section>

  <section id="picks" aria-labelledby="picksT">
    <h2 id="picksT">꿈동글 픽</h2>
    <p class="lead">직접 써 보고 고른 추천템이에요. 버튼을 누르면 해당 쇼핑 페이지로 이동해요.</p>
    <div class="tabs" role="tablist" aria-label="카테고리" id="tabs"></div>
    <div class="plist" id="grid"></div>
  </section>

  <section id="posts" aria-labelledby="postsT">
    <h2 id="postsT">대표 포스팅</h2>
    <p class="lead">최신 글부터 보여 드려요.</p>
    <ul class="posts" id="postList"></ul>
  </section>

  <section id="channels" aria-labelledby="chT">
    <h2 id="chT">채널 모음</h2>
    <p class="lead">블로그, 인스타그램, 유튜브, 네이버 인플루언서에서 만나요.</p>
    <div class="plist" id="chList"></div>
  </section>
</div>
</main>

<footer>
  <div class="wrap">
    <p class="notice" id="notice"></p>
  </div>
</footer>

/* ★ DATA 영역 끝 — 아래는 화면을 그리는 코드라 건드리지 않아도 돼요 ★
   ========================================================================== */

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* http(s) 주소만 링크로 인정 (그 외·빈 값은 '링크 없음' 처리) */
const safeUrl = (u) => (typeof u === 'string' && /^https?:\/\/\S+$/i.test(u.trim())) ? u.trim() : '';

/* 링크 버튼: 주소가 있으면 새 탭 + 보안 속성, 없으면 비활성 */
function linkBtn(url, label, pending) {
  const u = safeUrl(url);
  return u
    ? `<a class="btn" href="${esc(u)}" target="_blank" rel="noopener noreferrer sponsored">${label}</a>`
    : `<span class="btn" role="link" aria-disabled="true">${pending}</span>`;
}

/* 이미지 (없거나 로딩 실패 시 대체 UI) */
function thumbHtml(src, alt, small) {
  const u = /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(src || '') ? src : safeUrl(src);
  return `<div class="thumb">${u ? `<img src="${esc(u)}" alt="${esc(alt)}" loading="lazy" data-fallback>` : (small ? '<span>🌿</span>' : '<span>🌿<br>이미지 준비 중</span>')}</div>`;
}
document.addEventListener('error', (e) => {
  if (e.target.matches && e.target.matches('img[data-fallback]')) {
    e.target.parentElement.innerHTML = '<span>🌿<br>이미지 없음</span>';
  }
}, true);

/* 추천템 + 카테고리 탭 */
let current = '전체';
function renderTabs() {
  $('#tabs').innerHTML = CATEGORIES.map((c) =>
    `<button class="tab" role="tab" type="button" aria-selected="${c === current}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
}
function renderProducts() {
  const list = products.filter((p) => current === '전체' || p.category === current);
  $('#grid').innerHTML = list.length ? list.map((p) => `
    <article class="prow">
      ${thumbHtml(p.image, p.name, true)}
      <div class="info">
        <span class="cat">${esc(p.category)}${p.isSample ? ' · 테스트용 예시' : ''}</span>
        <div class="name">${esc(p.name)}</div>
      </div>
      ${linkBtn(p.affiliateUrl, '최저가 보기', '링크 준비 중')}
    </article>`).join('') : '<div class="empty">이 카테고리의 제품을 준비 중이에요.</div>';
}
$('#tabs').addEventListener('click', (e) => {
  const b = e.target.closest('.tab'); if (!b) return;
  current = b.dataset.cat; renderTabs(); renderProducts();
});

/* 공동구매 (별도 게시판) */
function renderGroupBuys() {
  $('#gbGrid').innerHTML = groupBuys.length ? groupBuys.map((g) => `
    <article class="card">
      ${thumbHtml(g.image, g.name)}
      <div class="body">
        <span class="cat">공동구매</span>
        ${g.isSample ? '<span class="tag">테스트용 예시</span>' : ''}
        <div class="name">${esc(g.name)}</div>
        <div class="reason">${esc(g.reason)}</div>
        <div class="price">${g.priceRange ? esc(g.priceRange) : '가격대 준비 중'}</div>
        <div class="meta">${g.period ? '기간 ' + esc(g.period) : '기간 준비 중'}</div>
        ${linkBtn(g.url, '공동구매 보러 가기', '링크 준비 중')}
      </div>
    </article>`).join('') : '<div class="empty" style="grid-column:1/-1">진행 중인 공동구매를 준비 중이에요.</div>';
}

/* 대표 포스팅 (최신순) */
function renderPosts() {
  const sorted = [...posts].sort((a, b) => String(b.date).localeCompare(String(a.date)));
  $('#postList').innerHTML = sorted.length ? sorted.map((p) => `
    <li class="post">
      ${thumbHtml(p.thumbnail, p.title)}
      <div class="info">
        <div class="t">${esc(p.title)}${p.isSample ? ' <span class="tag">테스트용</span>' : ''}</div>
        <div class="meta">${esc(p.channel)} · ${esc(p.date)}</div>
      </div>
      ${linkBtn(p.url, '보러 가기', '링크 준비 중')}
    </li>`).join('') : '<li class="empty">대표 포스팅을 준비 중이에요.</li>';
}

/* SNS 채널 + 푸터 링크 */
function renderChannels() {
  $('#chList').innerHTML = channels.map((c) => `
    <div class="prow">
      <div class="ic" aria-hidden="true">${esc(c.icon)}</div>
      <div class="info">
        <strong>${esc(c.name)}</strong>
        <span class="meta">${esc(c.description)}</span>
      </div>
      ${linkBtn(c.url, '바로가기', '준비 중')}
    </div>`).join('');
}

/* 다크모드 (선택 저장) */
const root = document.documentElement;
function applyTheme(t) {
  root.setAttribute('data-theme', t);
  $('#themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
  $('#themeBtn').setAttribute('aria-label', t === 'dark' ? '라이트모드로 전환' : '다크모드로 전환');
}
let saved = null;
try { saved = localStorage.getItem('dd-theme'); } catch (e) {}
applyTheme(saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('#themeBtn').addEventListener('click', () => {
  const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem('dd-theme', next); } catch (e) {}
});

/* 모바일 메뉴 */
$('#menuBtn').addEventListener('click', () => {
  const open = $('#nav').classList.toggle('open');
  $('#menuBtn').setAttribute('aria-expanded', open);
});
$('#nav').addEventListener('click', (e) => { if (e.target.closest('a')) { $('#nav').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded', false); } });

$('#notice').textContent = AFFILIATE_NOTICE;
renderTabs(); renderProducts(); renderGroupBuys(); renderPosts(); renderChannels();
</script>
</body>
</html>
